# JDK 21 is provided via the Gradle JVM toolchain (jvmToolchain(21) in :shared,
# :desktopApp, :androidApp), so no org.gradle.java.home is set anywhere. Gradle
# auto-detects/provisions JDK 21 on any OS (WSL or Windows). Do NOT reintroduce an
# OS-specific org.gradle.java.home here or in a user gradle.properties — it breaks
# the other OS. Build requires JDK 21 (jvmTarget = 21 in each module).

# Android (required now that :androidApp is re-enabled — §2.1):
# Android builds (AGP + dexing) are memory-heavy; give the daemon enough heap to avoid GC thrashing.
org.gradle.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
# rns-android (JitPack reticulum-kt snapshot) needs compileSdk 36, beyond AGP 8.7.3's
# "recommended" max of 35. The SDK is installed (platforms;android-36); this suppresses the advisory.
android.suppressUnsupportedCompileSdk=36
